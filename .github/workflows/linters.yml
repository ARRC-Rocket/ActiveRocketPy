name: Linters

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.py"
      - "**.ipynb"
      - ".github/**"
      - "pyproject.toml"
      - "requirements*"
      - ".pylintrc"

# cancel superseded runs on the same PR/ref.
concurrency:
  group: linters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    # pin to current stable major tags instead of @main.
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[all]
        pip install .[tests]
        # pin ruff for reproducible lint results (verified latest 2026-06-27).
        pip install pylint "ruff==0.15.20"
    - name: Ruff (lint)
      run: ruff check --output-format=github .
    - name: Ruff (format)
      run: ruff format --check .
    - name: Pylint
      run: |
        pylint rocketpy/ tests/ docs/
